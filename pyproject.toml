[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sparehour-worker"
version = "0.1.0"
description = "Opportunistic GPU and CPU worker for the Sparehour control plane"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sparehour contributors" }]
dependencies = [
  # Reuses ControlPlaneClient, AgentRunner executors, and the pydantic
  # contracts from the sparehour control-plane package. Compatibility
  # is tested against the 0.1 release line; until the package is published,
  # install it from a checkout or wheel first.
  "sparehour>=0.1.0,<0.2",
  # Direct imports in sparehour_worker.client: httpx for the controller transport,
  # certifi for the default CA roots (SSL_CERT_FILE/SSL_CERT_DIR override).
  # Bounds match the environments supported by the control plane.
  "httpx>=0.27,<1",
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
models = [
  "sparehour[models]>=0.1.0,<0.2",
]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
sparehour-worker = "sparehour_worker.cli:main"

[tool.hatch.build.targets.wheel]
# Hatch ships everything under src/sparehour_worker, including the dashboard.html
# page data served by sparehour_worker.dashboard — keep it inside the package.
packages = ["src/sparehour_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
