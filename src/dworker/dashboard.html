<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dworker</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
         background: #0e1116; color: #c9d1d9; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: .5px; }
  h2 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px;
       margin: 28px 0 10px; border-bottom: 1px solid #21262d; padding-bottom: 6px; }
  .sub { color: #8b949e; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 12px 14px; }
  .card .k { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .card .v { font-size: 16px; margin-top: 4px; }
  .ok { color: #3fb950; } .bad { color: #f85149; } .dim { color: #8b949e; } .warn { color: #d29922; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #21262d; vertical-align: top; }
  th { color: #8b949e; font-weight: normal; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
  button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px;
           padding: 4px 12px; font: inherit; cursor: pointer; }
  button:hover { background: #30363d; }
  button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  button.danger { background: #7d2828; border-color: #8b3434; color: #ffb1b1; }
  .chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 11px; border: 1px solid #30363d; }
  #notes { list-style: none; padding: 0; margin: 0; color: #8b949e; font-size: 12px; }
  #notes li { padding: 2px 0; }
  .banner { position: fixed; right: 18px; bottom: 18px; background: #1f6feb; color: #fff;
            padding: 8px 16px; border-radius: 8px; display: none; font-size: 13px; }
  a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>
<h1>dworker <span class="dim" id="agent"></span></h1>
<div class="sub"><span id="endpoint" class="dim"></span> · <span id="idle"></span> ·
  <button id="pause"></button> <button id="prefetch" class="primary">Prefetch images</button></div>

<h2>Overview</h2>
<div class="grid" id="overview"></div>

<h2>Slots</h2>
<table><thead><tr><th>Slot</th><th>Hardware</th><th>State</th><th>Current job</th></tr></thead>
<tbody id="slots"></tbody></table>

<h2>Queues &nbsp;<span class="dim" style="text-transform:none">(routes this machine can serve — toggle to advertise)</span></h2>
<table><thead><tr><th></th><th>Queue</th><th>Capability</th><th>Executor</th><th>This machine</th></tr></thead>
<tbody id="queues"></tbody></table>

<h2>Prefetch</h2>
<ul id="prefetch" class="dim" style="font-size:12px"></ul>

<h2>Activity</h2>
<ul id="notes"></ul>

<div class="banner" id="banner"></div>

<script>
let state = null;
async function refresh() {
  try {
    const r = await fetch('/api/status');
    state = await r.json();
    render();
  } catch (e) { document.getElementById('idle').textContent = 'dashboard: control loop down?'; }
}
function chip(text, cls) { return `<span class="chip ${cls}">${text}</span>`; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render() {
  if (!state || state.error) return;
  const s = state;
  document.getElementById('agent').textContent = '· ' + s.agent_id;
  document.getElementById('endpoint').textContent = s.endpoint || '(no endpoint)';
  const idle = s.idle_only
    ? (s.idle_ok ? chip('IDLE — claiming work', 'ok') : chip('busy — holding back', 'warn') + ` <span class="dim">${esc(s.idle_reason)}</span>`)
    : '<span class="dim">runs whenever work is queued</span>';
  document.getElementById('idle').innerHTML = idle;
  const pause = document.getElementById('pause');
  pause.textContent = s.paused ? 'Resume' : 'Pause claiming';
  pause.className = s.paused ? 'primary' : 'danger';
  document.getElementById('overview').innerHTML = [
    ['Jobs started', s.started_jobs], ['Jobs finished', s.completed],
    ['Uptime', Math.floor(s.uptime_seconds / 60) + ' min'],
    ['Capabilities', (s.capabilities.length ? s.capabilities.join(', ') : 'none selected')],
    ['Model packs', s.model_packs.length ? s.model_packs.join(', ') : '—'],
    ['Docker', s.docker ? chip('available', 'ok') : chip('missing', 'bad')],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('slots').innerHTML = Object.entries(s.slots).length
    ? Object.entries(s.slots).map(([id, info]) => `<tr>
        <td>${esc(id)}</td><td class="dim">${esc(info.hardware)}</td>
        <td>${chip(esc(info.state), info.state === 'running' ? 'ok' : 'dim')}</td>
        <td>${info.job ? `${esc(info.job.workload)} <span class="dim">${esc(info.job.id)} · ${esc(info.job.started_at)}</span>` : '<span class="dim">—</span>'}</td>
      </tr>`).join('')
    : '<tr><td colspan="4" class="dim">no slots registered</td></tr>';
  document.getElementById('queues').innerHTML = s.queues.length
    ? s.queues.map(q => `<tr>
        <td><button data-cap="${esc(q.capability)}" data-sel="${q.selected ? 0 : 1}"
          class="${q.selected ? 'danger' : 'primary'}">${q.selected ? 'Stop' : 'Run'}</button></td>
        <td><b>${esc(q.workload)}</b> <span class="dim">/ ${esc(q.route)}${q.selected ? ' · advertised' : ''}</span></td>
        <td>${esc(q.capability)}</td>
        <td class="dim">${esc(q.executor_type)} ${esc(q.executor_detail)}</td>
        <td>${q.eligible ? chip('eligible', 'ok') : chip('no', 'bad')} <span class="dim">${esc(q.match_reason)}</span></td>
      </tr>`).join('')
    : '<tr><td colspan="5" class="dim">no workloads visible to this token</td></tr>';
  document.getElementById('prefetch').innerHTML = (s.prefetch_log || []).map(l => `<li>${esc(l)}</li>`).join('') || '<li>—</li>';
  document.getElementById('notes').innerHTML = (s.notes || []).map(n => `<li>${esc(n)}</li>`).join('');
}
document.getElementById('pause').onclick = async () => {
  await fetch('/api/pause', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({paused: !state.paused})});
  refresh();
};
document.getElementById('prefetch').onclick = async () => {
  await fetch('/api/prefetch', {method: 'POST'});
  banner('Prefetch started — results below');
};
document.addEventListener('click', async ev => {
  const btn = ev.target.closest('button[data-cap]');
  if (!btn) return;
  const r = await fetch('/api/select', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({capability: btn.dataset.cap, selected: btn.dataset.sel === '1'})});
  const body = await r.json();
  banner(body.message || (body.ok ? 'applied' : 'rejected'));
  setTimeout(refresh, 400);
});
function banner(text) {
  const el = document.getElementById('banner');
  el.textContent = text; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
